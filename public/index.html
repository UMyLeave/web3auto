<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BSC v4 流动性保护</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/modules/sidebar.css">
</head>
<body data-page="monitor">
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="polling" class="polling" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span id="pollingText">同步中</span>
  </div>

  <main class="shell">
    <header class="workspace-bar">
      <div>
        <strong>流动性保护</strong>
        <span>BSC · Uniswap v4</span>
      </div>
      <span id="mode" class="badge">读取中</span>
    </header>

    <div class="metric-grid">
      <div class="metric-card">
        <span>监控状态</span>
        <strong id="running">-</strong>
      </div>
      <div class="metric-card">
        <span>最新区块</span>
        <strong id="block">-</strong>
      </div>
      <div class="metric-card target-position-metric">
        <span>对方仓位合计</span>
        <strong id="targetPosition">-</strong>
        <small id="targetPositionDetail">预计可撤本金 · 不含未领取手续费</small>
      </div>
    </div>

    <div class="content-grid">
      <div class="main-column">
        <section class="panel setup">
          <div class="section-heading">
            <h2>监控设置</h2>
            <span class="live-dot"><span></span>最新区块 · 多节点共识</span>
          </div>
          <div class="fields">
            <div class="field target-id-field">
              <label for="target">对方 NFT ID（可多个）</label>
              <textarea id="target" rows="1" autocomplete="off" placeholder="例如：1234, 1235, 1236"></textarea>
              <small class="field-note">支持逗号、空格或换行分隔；任意仓位流动性减少都会触发</small>
            </div>
            <div class="field">
              <label for="mine">我的 NFT ID</label>
              <input id="mine" inputmode="numeric" autocomplete="off" placeholder="例如 5678">
            </div>
            <div class="field">
              <label for="slippage">卖出滑点</label>
              <div class="input-with-unit">
                <input id="slippage" type="number" min="0" max="5" step="0.01" value="1">
                <span>%</span>
              </div>
              <small class="field-note">当前：<strong id="slippageBps">100 BPS</strong></small>
            </div>
          </div>
          <div id="positionPreview" class="position-preview" aria-live="polite">
            <div class="preview-empty">输入一个或多个对方 NFT ID 后自动进行只读仓位查询</div>
          </div>
          <div class="actions">
            <button id="save">保存设置</button>
            <button id="check" class="secondary">只读检查</button>
            <button id="start" class="secondary">验证并布防</button>
            <button id="retry" class="secondary">重试兑换</button>
            <button id="resolveManual" class="secondary">确认已手动处理</button>
            <button id="stop" class="danger">停止</button>
          </div>
        </section>

        <section class="panel result-panel">
          <div class="section-title">
            <h2>最终执行结果</h2>
            <span id="updated" class="muted">-</span>
          </div>
          <div id="result" class="execution-summary">
            <div class="result-empty">尚未执行</div>
          </div>
          <p id="error" class="error"></p>
        </section>
      </div>
    </div>
  </main>

  <aside id="alertDrawer" class="alert-drawer" aria-live="assertive" aria-hidden="true">
    <div class="alert-icon">!</div>
    <div class="alert-copy">
      <h2>检测到对方流动性减少</h2>
      <p id="alertBody">正在处理你的仓位，请查看最终结果。</p>
    </div>
    <button id="closeAlert" class="icon-button" aria-label="关闭报警提示" title="关闭">×</button>
  </aside>

  <script type="module" src="/modules/sidebar.js"></script>
  <script src="app.js"></script>
</body>
</html>
